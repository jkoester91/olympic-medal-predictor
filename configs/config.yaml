data:
  raw_athlete_path: "data/athlete_events.csv"
  raw_noc_path: "data/noc_regions.csv"
  test_size: 0.2
  random_state: 42

training:
  # 1. Baseline Random Forest
  baseline_rf:
    n_estimators: 50
    max_depth: 10
    random_state: 42
  
  # 2. Deeper Random Forest
  deep_rf:
    n_estimators: 100
    max_depth: 20
    random_state: 42

  # 3. Wider Random Forest
  wide_rf:
    n_estimators: 200
    max_depth: 12
    random_state: 42

  # 4. Standard Gradient Boosting
  gradient_boost:
    n_estimators: 50
    learning_rate: 0.1
    max_depth: 3
    random_state: 42

  # 5. Aggressive Gradient Boosting
  fast_gb:
    n_estimators: 100
    learning_rate: 0.2
    max_depth: 5
    random_state: 42